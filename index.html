<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>신나는 예주, 동하 영어 놀이터</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
    * { box-sizing: border-box; font-family: 'Jua', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; padding: 0; background: #FFF9EC; color: #333; min-height: 100vh; }
    header { background: linear-gradient(135deg, #3A86FF, #2EC4B6); color: #fff; padding: 14px 18px; font-size: 1.4rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .voice-wrap { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .voice-select { background: rgba(255,255,255,0.95); color: #333; border: 2px solid #FFE082; padding: 6px 12px; border-radius: 16px; font-size: 0.95rem; cursor: pointer; outline: none; }
    .voice-status { font-size: 0.82rem; background: rgba(0,0,0,0.18); padding: 4px 10px; border-radius: 12px; color: #FFFDF7; max-width: 240px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .star-badge { background: #FFD166; color: #5A3A00; padding: 6px 14px; border-radius: 20px; font-size: 1.05rem; }
    nav { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 12px; background: #EBF5FF; }
    @media (min-width: 720px) { nav { grid-template-columns: repeat(5, 1fr); } }
    .nav-btn { background: #fff; border: 3px solid #90CAF9; border-radius: 16px; padding: 10px 6px; font-size: 1rem; cursor: pointer; color: #444; }
    .nav-btn.active { background: #3A86FF; color: #fff; border-color: #1D4ED8; }
    main { padding: 18px; max-width: 980px; margin: 0 auto; }
    .section { display: none; }
    .section.active { display: block; }
    h2 { text-align: center; color: #1D4ED8; font-size: 1.5rem; margin-top: 0; }
    .back-bar { display: flex; justify-content: flex-start; margin-bottom: 14px; }
    .back-btn { background: #6C757D; color: #fff; border: none; padding: 10px 18px; border-radius: 14px; font-size: 1.1rem; cursor: pointer; box-shadow: 0 3px 0 #495057; }

    /* 1. 알파벳 */
    .grid-letters { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .letter-card { background: #fff; border: 3px solid #3A86FF; border-radius: 18px; padding: 12px 6px; text-align: center; font-size: 1.85rem; cursor: pointer; box-shadow: 0 4px 0 #2563EB; }
    .letter-card.vowel { border-color: #FF5E5B; box-shadow: 0 4px 0 #D93835; background: #FFF5F5; }
    .letter-sub { display: block; font-size: 0.85rem; color: #666; margin-top: 3px; }

    .solo-view { background: #fff; border: 4px solid #90CAF9; border-radius: 28px; padding: 34px 20px; text-align: center; box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
    .solo-big-char { font-size: 6.5rem; line-height: 1.15; color: #3A86FF; margin: 8px 0; }
    .solo-sub { font-size: 1.6rem; color: #555; margin-bottom: 18px; }
    .solo-art { min-height: 180px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
    .solo-art .word-emoji { font-size: 8.5rem; }
    .solo-word { font-size: 3.4rem; line-height: 1.2; color: #1D4ED8; margin-bottom: 6px; }
    .solo-meaning { font-size: 1.75rem; color: #666; margin-bottom: 22px; }

    /* 2. 그림 영단어 */
    .top-category-bar { background: #EBF5FF; border: 3px solid #90CAF9; border-radius: 22px; padding: 14px 16px; margin-bottom: 14px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .cat-tabs { display: flex; justify-content: center; gap: 7px; flex-wrap: wrap; }
    .cat-btn { padding: 8px 12px; border-radius: 18px; border: none; background: #E6E6E6; font-size: 0.96rem; cursor: pointer; color: #444; }
    .cat-btn.active { background: #3A86FF; color: #fff; box-shadow: 0 3px 0 #1D4ED8; }
    .sub-band-bar { display: none; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .sub-band-bar.show { display: flex; }
    .sub-band-btn { padding: 7px 14px; border-radius: 14px; border: 2px solid #90CAF9; background: #fff; color: #1E3A8A; font-size: 0.95rem; cursor: pointer; }
    .sub-band-btn.active { background: #2EC4B6; color: #fff; border-color: #1F8E83; }
    .top-write-btn { background: #2EC4B6; color: #fff; border: none; padding: 10px 22px; border-radius: 18px; font-size: 1.1rem; cursor: pointer; box-shadow: 0 3px 0 #1F8E83; }
    .count-info { text-align: center; color: #555; margin-bottom: 10px; font-size: 1.05rem; }
    .word-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 14px; }
    .word-card { background: #fff; border-radius: 20px; padding: 16px 10px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.08); border: 3px solid #BFDBFE; cursor: pointer; }
    .word-art { height: 92px; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
    .word-emoji { font-size: 4.1rem; line-height: 1; }
    .num-badge-art { width: 78px; height: 78px; border-radius: 20px; background: linear-gradient(135deg, #3A86FF, #00B4D8); color: #fff; font-size: 2.1rem; font-weight: bold; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 #1D4ED8; }
    .color-swatch-art { width: 78px; height: 78px; border-radius: 22px; border: 3px solid #CBD5E1; box-shadow: 0 4px 0 rgba(0,0,0,0.12); display: flex; align-items: center; justify-content: center; font-size: 2.1rem; }
    .word-en { font-size: 1.32rem; color: #1E3A8A; word-break: break-word; }
    .word-ko { font-size: 0.98rem; color: #666; margin-top: 3px; word-break: keep-all; }

    /* 3. 따라 쓰기 */
    .canvas-container { background: #fff; border-radius: 24px; padding: 20px; text-align: center; box-shadow: 0 6px 15px rgba(0,0,0,0.08); }
    .write-target-header { margin-bottom: 14px; }
    .write-meaning-reveal { margin-top: 12px; min-height: 38px; padding: 10px 16px; border-radius: 16px; background: #ECFDF5; border: 2px solid #6EE7B7; color: #065F46; font-size: 1.35rem; display: none; }
    #writeCanvas { width: 100%; max-width: 900px; height: auto; aspect-ratio: 900 / 450; border: 5px solid #3A86FF; border-radius: 24px; background: #fff; touch-action: none; cursor: crosshair; display: block; margin: 0 auto; }
    .action-btn { background: #FF7A00; color: #fff; border: none; padding: 12px 20px; font-size: 1.1rem; border-radius: 16px; margin: 6px 4px; cursor: pointer; box-shadow: 0 4px 0 #C85500; }
    .action-btn.blue { background: #3A86FF; box-shadow: 0 4px 0 #2667CC; }
    .action-btn.green { background: #2EC4B6; box-shadow: 0 4px 0 #1F8E83; }
    .mini-btn { padding: 8px 14px; font-size: 1.05rem; border-radius: 12px; border: 2px solid #DDD; background: #FAFAFA; cursor: pointer; }

    /* 4. 영어 퀴즈 & 5. 공부방 */
    .quiz-box { background: #fff; border-radius: 24px; padding: 25px; text-align: center; box-shadow: 0 6px 15px rgba(0,0,0,0.08); }
    .quiz-art { height: 160px; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; }
    .quiz-art .word-emoji { font-size: 7.5rem; }
    .quiz-art .num-badge-art { width: 120px; height: 120px; font-size: 3.1rem; border-radius: 28px; }
    .quiz-art .color-swatch-art { width: 120px; height: 120px; font-size: 3.2rem; border-radius: 30px; }
    .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }
    .quiz-opt-btn { background: #F8FAFC; border: 3px solid #90CAF9; border-radius: 18px; padding: 16px 10px; font-size: 1.5rem; cursor: pointer; color: #1E3A8A; }
    .stats-card { background: #fff; border-radius: 24px; padding: 25px; text-align: center; box-shadow: 0 6px 15px rgba(0,0,0,0.08); }
    .sticker-board { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 20px; font-size: 2.5rem; background: #EFF6FF; padding: 20px; border-radius: 20px; min-height: 100px; }
  </style>
</head>
<body>
  <header>
    <div>🔤 신나는 예주, 동하 영어 놀이터</div>
    <div class="header-right">
      <div class="voice-wrap">
        <select id="voiceProfileSelect" class="voice-select" onchange="changeVoiceProfile()" aria-label="목소리 선택">
          <option value="girl">👧 여자아이 목소리</option>
          <option value="woman">👩 여자 어른 목소리</option>
          <option value="boy">👦 남자아이 목소리</option>
          <option value="man">👨 남자 어른 목소리</option>
        </select>
        <span class="voice-status" id="voiceStatusLabel" title="현재 연결된 음성">엔진 확인 중...</span>
      </div>
      <div class="star-badge">⭐ 별 스티커: <span id="starCount">0</span>개</div>
    </div>
  </header>

  <nav id="mainNav">
    <button type="button" class="nav-btn active" onclick="showTab('tab1', this)">1. 알파벳 A~Z</button>
    <button type="button" class="nav-btn" onclick="showTab('tab2', this)">2. 그림 영단어</button>
    <button type="button" class="nav-btn" onclick="showTab('tab3', this)">3. 따라 쓰기</button>
    <button type="button" class="nav-btn" onclick="showTab('tab4', this)">4. 영어 퀴즈</button>
    <button type="button" class="nav-btn" onclick="showTab('tab5', this)">5. 나의 공부방</button>
  </nav>

  <main>
    <!-- 1. 알파벳 A~Z -->
    <section id="tab1" class="section active">
      <div id="letterListView">
        <h2>🔤 알파벳을 눌러 크게 보고 원어민 발음을 들어보세요!</h2>
        <p style="text-align:center; color:#666; margin-top:-6px;">빨간 테두리는 모음(A, E, I, O, U)이에요!</p>
        <div class="grid-letters" id="alphabetGrid"></div>
      </div>
      <div id="letterSoloView" class="solo-view" style="display:none;">
        <div class="back-bar"><button type="button" class="back-btn" onclick="closeLetterSolo()">← 뒤로 가기</button></div>
        <div class="solo-big-char" id="soloLetterChar">Aa</div>
        <div class="solo-sub" id="soloLetterDesc">🍎 apple (사과)</div>
        <button type="button" class="action-btn blue" id="soloLetterSpeakBtn">🔊 영어 발음 듣기</button>
        <button type="button" class="action-btn green" id="soloLetterWriteBtn">✍️ 따라 쓰기</button>
      </div>
    </section>

    <!-- 2. 그림 영단어 -->
    <section id="tab2" class="section">
      <div id="wordListView">
        <h2>🖼️ 종류별 그림 영단어를 눌러 크게 보고 들어보세요!</h2>
        <div class="top-category-bar">
          <div class="cat-tabs">
            <button type="button" class="cat-btn active" onclick="filterWords('all', this)">🌈 전체</button>
            <button type="button" class="cat-btn" onclick="filterWords('num_1_10', this)">1️⃣ 숫자 1~10</button>
            <button type="button" class="cat-btn" onclick="filterWords('num_11_20', this)">🔟 숫자 11~20</button>
            <button type="button" class="cat-btn" onclick="filterWords('num_21_100', this)">💯 숫자 21~100</button>
            <button type="button" class="cat-btn" onclick="filterWords('colors_all', this)">🎨 전체 색상</button>
            <button type="button" class="cat-btn" onclick="filterWords('home', this)">🏠 집</button>
            <button type="button" class="cat-btn" onclick="filterWords('clothes', this)">👕 의류</button>
            <button type="button" class="cat-btn" onclick="filterWords('food', this)">🍎 음식</button>
            <button type="button" class="cat-btn" onclick="filterWords('around', this)">☀️ 우리 주변</button>
            <button type="button" class="cat-btn" onclick="filterWords('transport', this)">🚗 교통</button>
            <button type="button" class="cat-btn" onclick="filterWords('job', this)">💼 직업과 사무실</button>
            <button type="button" class="cat-btn" onclick="filterWords('hospital', this)">🏥 병원과 약품</button>
            <button type="button" class="cat-btn" onclick="filterWords('school', this)">🏫 학교와 공부</button>
            <button type="button" class="cat-btn" onclick="filterWords('world', this)">🌍 세계</button>
            <button type="button" class="cat-btn" onclick="filterWords('plant_animal', this)">🐶 식물과 동물</button>
            <button type="button" class="cat-btn" onclick="filterWords('sports', this)">⚽ 스포츠와 야외 활동</button>
            <button type="button" class="cat-btn" onclick="filterWords('hobby', this)">🎨 취미와 여가</button>
            <button type="button" class="cat-btn" onclick="filterWords('basic', this)">⭐ Basic words 기본 단어</button>
          </div>
          <button type="button" class="top-write-btn" onclick="sendToWrite(selectedWordForWrite, selectedWordKo)">
            ✍️ <span id="topWriteLabel">one</span> 따라쓰기
          </button>
        </div>

        <div class="sub-band-bar" id="subBand21To100">
          <button type="button" class="sub-band-btn active" onclick="setBand21To100('all', this)">21~100 (80개)</button>
          <button type="button" class="sub-band-btn" onclick="setBand21To100('21_40', this)">21~40</button>
          <button type="button" class="sub-band-btn" onclick="setBand21To100('41_60', this)">41~60</button>
          <button type="button" class="sub-band-btn" onclick="setBand21To100('61_80', this)">61~80</button>
          <button type="button" class="sub-band-btn" onclick="setBand21To100('81_100', this)">81~100</button>
        </div>

        <div class="count-info" id="wordCountInfo"></div>
        <div style="text-align:center; margin-bottom:14px;">
          <input type="text" id="wordSearch" placeholder="영어 또는 한글 단어 검색" oninput="renderWords()" style="padding:10px 15px; width:85%; max-width:360px; border-radius:15px; border:2px solid #90CAF9; font-size:1rem;">
        </div>
        <div class="word-grid" id="wordGrid"></div>
      </div>

      <div id="wordSoloView" class="solo-view" style="display:none;">
        <div class="back-bar"><button type="button" class="back-btn" onclick="closeWordSolo()">← 뒤로 가기</button></div>
        <div class="solo-art" id="soloWordArt"></div>
        <div class="solo-word" id="soloWordEn"></div>
        <div class="solo-meaning" id="soloWordKo"></div>
        <button type="button" class="action-btn blue" id="soloWordSpeakBtn">🔊 영어 발음 듣기</button>
        <button type="button" class="action-btn green" id="soloWordWriteBtn">✍️ 따라 쓰기</button>
      </div>
    </section>

    <!-- 3. 알파벳·단어 따라 쓰기 -->
    <section id="tab3" class="section">
      <div class="back-bar"><button type="button" class="back-btn" onclick="goBackFromWrite()">← 뒤로 가기</button></div>
      <h2>✍️ 손가락으로 알파벳과 영단어를 따라 써보세요!</h2>
      <div class="canvas-container">
        <div class="write-target-header">
          <div>
            <span style="font-size:1.4rem;">연습 단어: </span>
            <strong id="targetWriteWord" style="font-size:2.6rem; color:#3A86FF;">apple</strong>
            <button type="button" class="mini-btn" onclick="speakEn(document.getElementById('targetWriteWord').innerHTML)">🔊 발음 듣기</button>
            <button type="button" class="mini-btn" onclick="pickRandomWriteWord(true)">🎲 다른 단어</button>
          </div>
        </div>
        <canvas id="writeCanvas" width="900" height="450"></canvas>
        <div class="write-meaning-reveal" id="writeMeaningReveal"></div>
        <div style="margin-top:12px;">
          <button type="button" class="action-btn" onclick="clearCanvas()">🧹 지우기</button>
          <button type="button" class="action-btn blue" onclick="showWriteMeaningNow()">📖 한글 뜻 확인</button>
          <button type="button" class="action-btn green" onclick="completeWriting()">🎉 다 썼어요! (+별 1개)</button>
        </div>
      </div>
    </section>

    <!-- 4. 영어 퀴즈 -->
    <section id="tab4" class="section">
      <h2>🎯 그림과 영어 발음을 듣고 정답을 맞혀요!</h2>
      <div class="quiz-box">
        <div class="quiz-art" id="quizArt"></div>
        <button type="button" class="action-btn blue" onclick="playQuizHint()">🔊 영어 발음 듣기</button>
        <div class="quiz-options" id="quizOptions"></div>
        <p id="quizFeedback" style="font-size:1.4rem; margin-top:15px; min-height:30px;"></p>
      </div>
    </section>

    <!-- 5. 나의 공부방 -->
    <section id="tab5" class="section">
      <h2>🏆 나의 영어 공부방</h2>
      <div class="stats-card">
        <h3>우리 아이 칭찬 스티커 판</h3>
        <div style="font-size:1.3rem; margin:10px 0;">
          ✍️ 따라 쓴 단어 수: <strong id="writtenCount">0</strong>개 |
          🎯 맞힌 퀴즈 수: <strong id="quizScore">0</strong>개
        </div>
        <div class="sticker-board" id="stickerBoard"></div>
        <button type="button" class="action-btn" style="margin-top:20px; background:#888888; box-shadow:none;" onclick="resetProgress()">기록 초기화</button>
      </div>
    </section>
  </main>

  <script>
    var memoryStore = { stars: 0, written: 0, quiz: 0, stickers: [] };
    var progress = loadProgress();
    var voiceProfile = 'girl';
    var previousTabId = 'tab2';
    var cachedVoices = [];

    var voiceConfigs = {
      girl: { label: '여자아이', rate: 0.92, pitch: 1.55, keywords: ['samantha', 'victoria', 'zira', 'jenny', 'aria', 'female', 'woman'] },
      woman: { label: '여자 어른', rate: 0.88, pitch: 1.05, keywords: ['samantha', 'ava', 'jenny', 'aria', 'female', 'woman'] },
      boy: { label: '남자아이', rate: 0.92, pitch: 1.25, keywords: ['alex', 'daniel', 'david', 'guy', 'male', 'man'] },
      man: { label: '남자 어른', rate: 0.82, pitch: 0.72, keywords: ['daniel', 'alex', 'david', 'guy', 'male', 'man'] }
    };

    function getEnglishVoices() {
      var list = [];
      for (var i = 0; i < cachedVoices.length; i++) {
        var v = cachedVoices[i];
        if (v.lang && v.lang.toLowerCase().indexOf('en') === 0) list.push(v);
      }
      return list;
    }

    function refreshVoices() {
      try {
        if ('speechSynthesis' in window) {
          cachedVoices = window.speechSynthesis.getVoices() || [];
          updateVoiceStatusLabel();
        }
      } catch (e) {}
    }

    function updateVoiceStatusLabel() {
      var el = document.getElementById('voiceStatusLabel');
      if (!el) return;
      var enVoices = getEnglishVoices();
      var chosen = pickBestEnglishVoice(voiceProfile);
      var cfg = voiceConfigs[voiceProfile] || voiceConfigs.girl;
      if (!('speechSynthesis' in window)) {
        el.innerHTML = '음성 미지원 브라우저';
        return;
      }
      if (enVoices.length === 0) {
        el.innerHTML = '영어 음성 0개 · 톤조절(' + cfg.label + ')';
      } else {
        el.innerHTML = '영어 ' + enVoices.length + '개 · ' + (chosen ? chosen.name : enVoices[0].name);
      }
    }

    if ('speechSynthesis' in window) {
      refreshVoices();
      window.speechSynthesis.onvoiceschanged = refreshVoices;
    }

    function pickBestEnglishVoice(profileKey) {
      var enVoices = getEnglishVoices();
      if (enVoices.length === 0) return null;
      var cfg = voiceConfigs[profileKey] || voiceConfigs.girl;
      for (var k = 0; k < cfg.keywords.length; k++) {
        var kw = cfg.keywords[k];
        for (var j = 0; j < enVoices.length; j++) {
          var vn = (enVoices[j].name || '').toLowerCase();
          if (vn.indexOf(kw) !== -1) return enVoices[j];
        }
      }
      return enVoices[0];
    }

    function changeVoiceProfile() {
      var sel = document.getElementById('voiceProfileSelect');
      voiceProfile = sel ? sel.value : 'girl';
      updateVoiceStatusLabel();
      speakEn('Hello! Let us learn English together!');
    }

    function loadProgress() {
      try {
        var raw = window.localStorage.getItem('englishPlaygroundV6');
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return memoryStore;
    }

    function saveProgress() {
      memoryStore = progress;
      try { window.localStorage.setItem('englishPlaygroundV6', JSON.stringify(progress)); } catch (e) {}
    }

    function playChime(ok) {
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        var ctx = new AC();
        var freqs = ok ? [523.25, 659.25, 783.99, 1046.5] : [330, 261.63];
        for (var i = 0; i < freqs.length; i++) {
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = freqs[i];
          var t = ctx.currentTime + i * 0.09;
          gain.gain.setValueAtTime(0.14, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.24);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(t);
          osc.stop(t + 0.25);
        }
      } catch (e) {}

    function speakEn(text) {
      try {
        if (!('speechSynthesis' in window)) return;
        refreshVoices();
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US';
        var chosen = pickBestEnglishVoice(voiceProfile);
        if (chosen) u.voice = chosen;
        var cfg = voiceConfigs[voiceProfile] || voiceConfigs.girl;
        u.rate = cfg.rate;
        u.pitch = cfg.pitch;
        setTimeout(function() {
          try { window.speechSynthesis.speak(u); } catch (err) {}
        }, 30);
      } catch (e) {}
    }

        ['eat', '먹어요', '🍽️'], ['drink', '마셔요', '🥤'], ['sleep', '자요', '😴'], ['wake up', '일어나요', '⏰'],

        ['early', '일찍', '🌅'], ['late', '늦은', '⏰'], ['again', '다시', '🔁'], ['together', '함께', '🤝']
      ]
    };

    function buildWordDatabase() {
      var list = [];
      var seen = {};

      function pushItem(cat, en, ko, kind, extra) {
        var cleanEn = String(en).replace(/^\s+|\s+$/g, '');
        if (!cleanEn || /^my\b/i.test(cleanEn)) return;
        var key = cat + '::' + cleanEn.toLowerCase();
        if (seen[key]) return;
        seen[key] = true;
        list.push({ cat: cat, en: cleanEn, ko: ko, kind: kind, extra: extra });
        var baseKey = cleanEn.toLowerCase();
        if (!meaningLookup[baseKey]) meaningLookup[baseKey] = ko;
      }

      for (var n1 = 1; n1 <= 10; n1++) {
        pushItem('num_1_10', numberWordsMap[n1][0], numberWordsMap[n1][1], 'num', String(n1));
      }

      for (var n2 = 11; n2 <= 20; n2++) {
        pushItem('num_11_20', numberWordsMap[n2][0], numberWordsMap[n2][1], 'num', String(n2));
      }

      for (var n3 = 21; n3 <= 100; n3++) {
        pushItem('num_21_100', numberWordsMap[n3][0], numberWordsMap[n3][1], 'num', String(n3));
      }

      for (var c = 0; c < baseColors.length; c++) {
        pushItem('colors_all', baseColors[c][0], baseColors[c][1], 'color', { hex: baseColors[c][2], icon: baseColors[c][3] });
      }
      for (var s = 0; s < colorShades.length; s++) {
        for (var c2 = 0; c2 < baseColors.length; c2++) {
          if (list.filter(function(x) { return x.cat === 'colors_all'; }).length >= 100) break;
          pushItem(
            'colors_all',
            colorShades[s][0] + baseColors[c2][0],
            colorShades[s][1] + baseColors[c2][1],
            'color',
            { hex: baseColors[c2][2], icon: colorShades[s][3] }
          );
        }
      }

      var catKeys = Object.keys(seedCategories);
      for (var ck = 0; ck < catKeys.length; ck++) {
        var cname = catKeys[ck];
        var seeds = seedCategories[cname];
        for (var i = 0; i < seeds.length; i++) {
          pushItem(cname, seeds[i][0], seeds[i][1], 'emoji', seeds[i][2]);
        }
      }

      return list;
    }

    function renderArtHTML(item) {
      if (item.kind === 'num') {
        return '<div class="num-badge-art">' + item.extra + '</div>';
      }
      if (item.kind === 'color') {
        var cObj = item.extra || { hex: '#3B82F6', icon: '🎨' };
        var borderStyle = (cObj.hex.toUpperCase() === '#FFFFFF' || cObj.hex.toUpperCase() === '#FFFBEB') ? 'border-color:#94A3B8;' : '';
        return '<div class="color-swatch-art" style="background:' + cObj.hex + ';' + borderStyle + '">' + cObj.icon + '</div>';
      }
      return '<div class="word-emoji">' + item.extra + '</div>';
    }

    var wordDatabase = buildWordDatabase();
    var currentCategory = 'all';
    var band21To100 = 'all';
    var selectedWordForWrite = 'one';
    var selectedWordKo = '하나 (1)';

    function filterWords(cat, btn) {
      currentCategory = cat;
      band21To100 = 'all';
      var btns = document.querySelectorAll('.cat-btn');
      for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
      if (btn) btn.classList.add('active');

      var bandBar = document.getElementById('subBand21To100');
      if (cat === 'num_21_100') {
        bandBar.classList.add('show');
        var bBtns = bandBar.querySelectorAll('.sub-band-btn');
        for (var b = 0; b < bBtns.length; b++) bBtns[b].classList.toggle('active', b === 0);
      } else {
        bandBar.classList.remove('show');
      }

      closeWordSolo();
      renderWords();
    }

    function setBand21To100(bandKey, btn) {
      band21To100 = bandKey;
      var bBtns = document.querySelectorAll('#subBand21To100 .sub-band-btn');
      for (var i = 0; i < bBtns.length; i++) bBtns[i].classList.remove('active');
      if (btn) btn.classList.add('active');
      renderWords();
    }

    function openWordSolo(item) {
      selectedWordForWrite = item.en;
      selectedWordKo = item.ko;
      document.getElementById('topWriteLabel').innerHTML = item.en;
      document.getElementById('wordListView').style.display = 'none';
      document.getElementById('wordSoloView').style.display = 'block';
      document.getElementById('soloWordArt').innerHTML = renderArtHTML(item);
      document.getElementById('soloWordEn').innerHTML = item.en;
      document.getElementById('soloWordKo').innerHTML = item.ko;
      document.getElementById('soloWordSpeakBtn').onclick = function() { speakEn(item.en); };
      document.getElementById('soloWordWriteBtn').onclick = function() { previousTabId = 'tab2'; sendToWrite(item.en, item.ko); };
      speakEn(item.en);
    }

    function closeWordSolo() {
      document.getElementById('wordSoloView').style.display = 'none';
      document.getElementById('wordListView').style.display = 'block';
    }

    function matchNumberBand(item) {
      if (currentCategory !== 'num_21_100' || band21To100 === 'all') return true;
      var m = item.ko.match(/\((\d+)\)/);
      if (!m) return false;
      var num = parseInt(m[1], 10);
      if (band21To100 === '21_40') return num >= 21 && num <= 40;
      if (band21To100 === '41_60') return num >= 41 && num <= 60;
      if (band21To100 === '61_80') return num >= 61 && num <= 80;
      if (band21To100 === '81_100') return num >= 81 && num <= 100;
      return true;
    }

    function renderWords() {
      var grid = document.getElementById('wordGrid');
      var kw = (document.getElementById('wordSearch').value || '').toLowerCase().replace(/^\s+|\s+$/g, '');
      grid.innerHTML = '';
      var filtered = [];
      for (var i = 0; i < wordDatabase.length; i++) {
        var it = wordDatabase[i];
        var catOk = (currentCategory === 'all' || it.cat === currentCategory);
        var bandOk = matchNumberBand(it);
        var kwOk = (kw === '' || it.en.toLowerCase().indexOf(kw) !== -1 || it.ko.indexOf(kw) !== -1);
        if (catOk && bandOk && kwOk) filtered.push(it);
      }
      var catTitle = categoryLabels[currentCategory] || '전체';
      document.getElementById('wordCountInfo').innerHTML = catTitle + ': ' + filtered.length + '개 단어';
      if (filtered.length > 0) {
        selectedWordForWrite = filtered[0].en;
        selectedWordKo = filtered[0].ko;
        document.getElementById('topWriteLabel').innerHTML = filtered[0].en;
      } else {
        selectedWordForWrite = '';
        selectedWordKo = '';
        document.getElementById('topWriteLabel').innerHTML = '단어';
      }
      for (var j = 0; j < filtered.length; j++) {
        (function(item) {
          var card = document.createElement('div');
          card.className = 'word-card';
          card.innerHTML =
            '<div class="word-art">' + renderArtHTML(item) + '</div>' +
            '<div class="word-en">' + item.en + '</div>' +
            '<div class="word-ko">' + item.ko + '</div>';
          card.onclick = function() { openWordSolo(item); };
          grid.appendChild(card);
        })(filtered[j]);
      }
    }

    /* ================= 3. 따라 쓰기 ================= */
    var canvas = document.getElementById('writeCanvas');
    var ctx = canvas.getContext('2d');
    var isDrawing = false;
    var currentWriteMeaning = '사과';
    var hasDrawnStroke = false;

    function resolveKoreanMeaning(word, explicitKo) {
      if (explicitKo) return explicitKo;
      var low = (word || '').toLowerCase();
      if (meaningLookup[low]) return meaningLookup[low];
      for (var i = 0; i < wordDatabase.length; i++) {
        if (wordDatabase[i].en.toLowerCase() === low) return wordDatabase[i].ko;
      }
      return '영어 단어';
    }

    function setWriteMeaningUI(word, ko) {
      currentWriteMeaning = resolveKoreanMeaning(word, ko);
      var rev = document.getElementById('writeMeaningReveal');
      rev.style.display = 'none';
      rev.innerHTML = '';
    }

    function showWriteMeaningNow() {
      var word = document.getElementById('targetWriteWord').innerHTML;
      var rev = document.getElementById('writeMeaningReveal');
      rev.style.display = 'block';
      rev.innerHTML = '💡 <strong>' + word + '</strong>의 한글 뜻은 <strong>"' + currentWriteMeaning + '"</strong>이에요!';
    }

    function drawGuideText(word) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!word) return;
      ctx.save();
      ctx.fillStyle = '#E2E8F0';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      var baseSize = (word.length <= 3) ? 340 : ((word.length <= 7) ? 240 : 165);
      ctx.font = 'bold ' + baseSize + 'px Jua, sans-serif';
      var maxWidth = canvas.width - 70;
      var measured = ctx.measureText(word).width;
      if (measured > maxWidth) {
        baseSize = Math.floor(baseSize * (maxWidth / measured));
        ctx.font = 'bold ' + baseSize + 'px Jua, sans-serif';
      }
      ctx.fillText(word, canvas.width / 2, canvas.height / 2 + 10);
      ctx.restore();
    }

    function clearCanvas() {
      hasDrawnStroke = false;
      drawGuideText(document.getElementById('targetWriteWord').innerHTML);
      var rev = document.getElementById('writeMeaningReveal');
      rev.style.display = 'none';
      rev.innerHTML = '';
    }

    function pickRandomWriteWord(shouldSpeak) {
      var cur = document.getElementById('targetWriteWord').innerHTML;
      var pool = [];
      for (var i = 0; i < wordDatabase.length; i++) {
        if (wordDatabase[i].en !== cur) pool.push(wordDatabase[i]);
      }
      var nextObj = pool[Math.floor(Math.random() * pool.length)];
      document.getElementById('targetWriteWord').innerHTML = nextObj.en;
      setWriteMeaningUI(nextObj.en, nextObj.ko);
      clearCanvas();
      if (shouldSpeak) speakEn(nextObj.en);
    }

    function sendToWrite(word, ko) {
      if (!word) return;
      document.getElementById('targetWriteWord').innerHTML = word;
      setWriteMeaningUI(word, ko);
      showTab('tab3', document.querySelectorAll('#mainNav .nav-btn')[2]);
      clearCanvas();
      speakEn(word);
    }

    function goBackFromWrite() {
      var idx = (previousTabId === 'tab1') ? 0 : 1;
      showTab(previousTabId, document.querySelectorAll('#mainNav .nav-btn')[idx]);
    }

    function getPos(e) {
      var r = canvas.getBoundingClientRect();
      var cx = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
      var cy = (e.touches && e.touches[0]) ? e.touches[0].clientY : e.clientY;
      return { x: (cx - r.left) * (canvas.width / r.width), y: (cy - r.top) * (canvas.height / r.height) };
    }

    function startDraw(e) {
      isDrawing = true;
      hasDrawnStroke = true;
      var p = getPos(e);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineWidth = 24;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = '#3A86FF';
    }

    function moveDraw(e) {
      if (!isDrawing) return;
      if (e.cancelable) e.preventDefault();
      var p = getPos(e);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }

    function endDraw() {
      if (isDrawing && hasDrawnStroke) {
        var word = document.getElementById('targetWriteWord').innerHTML;
        var rev = document.getElementById('writeMeaningReveal');
        rev.style.display = 'block';
        rev.innerHTML = '✍️ 따라 쓴 단어 뜻: <strong>' + word + '</strong> = <strong>' + currentWriteMeaning + '</strong>';
      }
      isDrawing = false;
    }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', moveDraw);
    window.addEventListener('mouseup', endDraw);
    canvas.addEventListener('touchstart', startDraw, { passive: false });
    canvas.addEventListener('touchmove', moveDraw, { passive: false });
    window.addEventListener('touchend', endDraw);

    function completeWriting() {
      var finishedWord = document.getElementById('targetWriteWord').innerHTML;
      var finishedMeaning = currentWriteMeaning;
      playChime(true);
      addReward('write');

      var rev = document.getElementById('writeMeaningReveal');
      rev.style.display = 'block';
      rev.innerHTML = '🎉 참 잘했어요! <strong>' + finishedWord + '</strong>는 한글로 <strong>"' + finishedMeaning + '"</strong> 뜻이에요! (+별 1개)';

      speakEn('Great job! ' + finishedWord);
      setTimeout(function() {
        pickRandomWriteWord(false);
      }, 1800);
    }

    /* ================= 4. 영어 퀴즈 ================= */
    var currentQuiz = null;
    var quizAnswered = false;
    var quizNextTimer = null;

    function playQuizHint() {
      if (currentQuiz) speakEn(currentQuiz.en);
    }

    function generateQuiz() {
      if (quizNextTimer) {
        clearTimeout(quizNextTimer);
        quizNextTimer = null;
      }
      quizAnswered = false;
      var pool = wordDatabase.slice(0).sort(function() { return 0.5 - Math.random(); });
      currentQuiz = pool[0];
      var opts = [pool[0]];
      for (var k = 1; k < pool.length && opts.length < 4; k++) {
        if (pool[k].en !== currentQuiz.en) opts.push(pool[k]);
      }
      opts.sort(function() { return 0.5 - Math.random(); });

      document.getElementById('quizArt').innerHTML = renderArtHTML(currentQuiz);
      document.getElementById('quizFeedback').innerHTML = '';
      var box = document.getElementById('quizOptions');
      box.innerHTML = '';

      for (var i = 0; i < opts.length; i++) {
        (function(o) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'quiz-opt-btn';
          b.innerHTML = o.en;
          b.onclick = function() { checkQuiz(o.en); };
          box.appendChild(b);
        })(opts[i]);
      }
      speakEn(currentQuiz.en);
    }

    function checkQuiz(ans) {
      if (quizAnswered || !currentQuiz) return;
      var fb = document.getElementById('quizFeedback');
      if (ans === currentQuiz.en) {
        quizAnswered = true;
        var opts = document.querySelectorAll('#quizOptions .quiz-opt-btn');
        for (var i = 0; i < opts.length; i++) opts[i].disabled = true;
        playChime(true);
        fb.style.color = '#2EC4B6';
        fb.innerHTML = '🎉 정답이에요! ' + currentQuiz.en + ' (' + currentQuiz.ko + ')';
        speakEn('Good job! ' + currentQuiz.en);
        addReward('quiz');
        quizNextTimer = setTimeout(generateQuiz, 1300);
      } else {
        playChime(false);
        fb.style.color = '#FF5E5B';
        fb.innerHTML = '😅 다시 한 번 골라볼까요?';
        speakEn('Try again!');
      }
    }

    /* ================= 5. 공부방 & 탭 전환 ================= */
    var stickers = ['🦖', '🦄', '🚀', '👑', '🌈', '🐬', '🦁', '🍓', '🤖', '⚡'];
    function addReward(t) {
      progress.stars += 1;
      if (t === 'write') progress.written += 1;
      if (t === 'quiz') progress.quiz += 1;
      progress.stickers.push(stickers[Math.floor(Math.random() * stickers.length)]);
      saveProgress();
      updateStudyUI();
    }

    function updateStudyUI() {
      document.getElementById('starCount').innerHTML = progress.stars;
      document.getElementById('writtenCount').innerHTML = progress.written;
      document.getElementById('quizScore').innerHTML = progress.quiz;
      document.getElementById('stickerBoard').innerHTML = progress.stickers.length
        ? progress.stickers.join(' ')
        : '아직 스티커가 없어요. 공부를 시작해 볼까요?';
    }

    function resetProgress() {
      if (confirm('정말 모든 스티커와 기록을 초기화할까요?')) {
        progress = { stars: 0, written: 0, quiz: 0, stickers: [] };
        saveProgress();
        updateStudyUI();
      }
    }

    function showTab(tabId, btn) {
      if (tabId !== 'tab3') previousTabId = tabId;
      var secs = document.querySelectorAll('.section');
      for (var i = 0; i < secs.length; i++) secs[i].classList.remove('active');
      var navs = document.querySelectorAll('#mainNav .nav-btn');
      for (var j = 0; j < navs.length; j++) navs[j].classList.remove('active');
      var target = document.getElementById(tabId);
      if (target) target.classList.add('active');
      if (btn) btn.classList.add('active');
      if (tabId === 'tab1') closeLetterSolo();
      if (tabId === 'tab2') closeWordSolo();
      if (tabId === 'tab3') {
        var curW = document.getElementById('targetWriteWord').innerHTML;
        setWriteMeaningUI(curW);
        clearCanvas();
      }
      if (tabId === 'tab4') generateQuiz();
      if (tabId === 'tab5') updateStudyUI();
    }

    initAlphabet();
    renderWords();
    setWriteMeaningUI(document.getElementById('targetWriteWord').innerHTML);
    clearCanvas();
    updateStudyUI();
  </script>
